<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Генератор на Сертификати</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    
   <style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #2c2c2c; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .admin-panel {
        background: white; 
        padding: 15px; 
        border-radius: 10px; 
        margin-bottom: 20px;
        display: flex; 
        gap: 15px; 
        align-items: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        z-index: 100;
    }

    #certificate-print-area {
        width: 1123px;
        height: 794px;
        position: relative;
        background-color: white;
        overflow: hidden;
    }

    .bg-template {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        object-fit: contain;
    }

    .name-overlay {
        position: absolute;
        top: 51%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
        text-align: center;
        font-family: 'Great Vibes', cursive;
        font-size: 100px; /* Начална стойност */
        color: #1a3a5a;
        white-space: nowrap;
        z-index: 2;
    }

    input[type="text"] { padding: 10px; width: 250px; border: 1px solid #003366; border-radius: 5px; }
    .size-control { display: flex; align-items: center; gap: 5px; font-family: sans-serif; font-size: 14px; }
    input[type="range"] { cursor: pointer; }
    button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; background: #27ae60; color: white; }

    @media print {
        .admin-panel { display: none !important; }
        body { background: white !important; }
        #certificate-print-area { box-shadow: none !important; margin: 0 !important; }
    }
</style>
</head>
<body>
    <div class="admin-panel">
        <input type="text" id="nameInput" placeholder="Име Фамилия..." oninput="document.getElementById('display-name').innerText = this.value || 'Име Фамилия'">
        
        <!-- Добавен контрол за размера на шрифта -->
        <div class="size-control">
            <label for="fontSizeRange">Размер:</label>
            <input type="range" id="fontSizeRange" min="40" max="120" value="100" oninput="document.getElementById('display-name').style.fontSize = this.value + 'px'; document.getElementById('sizeValue').innerText = this.value + 'px';">
            <span id="sizeValue">100px</span>
        </div>

        <button onclick="window.print()">🖨️ ЗАПАЗИ КАТО PDF / ПЕЧАТ</button>
    </div>

    <div id="certificate-print-area">
        <img src="Certificate.png" 
             class="bg-template" alt="Certificate">
        
        <div id="display-name" class="name-overlay">Име Фамилия</div>
    </div>
</body>
</html>
